<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <title>Leaflet Custom Icons - Tutorial 3</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <style>
        #map {
            height: 400px;
        }
    </style>

    <!-- Leaflet JavaScript (Don't Forget) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>

<body>

    <div id="map"></div>

    <script>

        // Initialize the map
        var map = L.map('map').setView([51.505, -0.09], 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Create a green leaf icon
        var greenIcon = L.icon({
            iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png',
            shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',

            iconSize:     [38, 95],
            shadowSize:   [50, 64],
            iconAnchor:   [22, 94],
            shadowAnchor: [4, 62],
            popupAnchor:  [-3, -76]
        });

        // Add the green leaf marker
        L.marker([51.5, -0.09], {icon: greenIcon})
            .addTo(map)
            .bindPopup("I am a green leaf.");

        // Define a reusable LeafIcon class
        var LeafIcon = L.Icon.extend({
            options: {
                shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
                iconSize:     [38, 95],
                shadowSize:   [50, 64],
                iconAnchor:   [22, 94],
                shadowAnchor: [4, 62],
                popupAnchor:  [-3, -76]
            }
        });

        // Create red and orange leaf icons
        var redIcon = new LeafIcon({
            iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-red.png'
        });

        var orangeIcon = new LeafIcon({
            iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-orange.png'
        });

        // Add red and orange markers
        L.marker([51.495, -0.083], {icon: redIcon})
            .addTo(map)
            .bindPopup("I am a red leaf.");

        L.marker([51.49, -0.1], {icon: orangeIcon})
            .addTo(map)
            .bindPopup("I am an orange leaf.");

    </script>

</body>
</html>
