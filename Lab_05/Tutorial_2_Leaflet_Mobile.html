<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <title>Leaflet on Mobile - Tutorial 2</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html, body, #map {
            height: 100%;
            width: 100%;
        }
    </style>

    <!-- Leaflet JavaScript (Don't Forget) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>

<body>

    <div id="map"></div>

    <script>

        // Initialize the map to show the whole world
        var map = L.map('map').fitWorld();

        // Add OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Location found event handler
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius +
                           " meters from this point").openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }

        // Location error event handler
        function onLocationError(e) {
            // If geolocation fails, center on Kyle Field
            map.setView([30.6084, -96.3402], 15);

            alert("Location access was denied or unavailable. Map centered on Kyle Field.");
        }

        // Register location event handlers
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        // Attempt to locate the user
        map.locate({setView: true, maxZoom: 16});

    </script>

</body>
</html>
